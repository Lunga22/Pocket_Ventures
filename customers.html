<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Ledger - PocketVentures</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <a href="index.html" class="btn-utility" style="text-decoration: none;">← Back</a>
        <h1>Customer Directory</h1>
      </div>
      <div class="header-actions">
        <span id="customer-count-badge" class="badge-info">0 Contacts</span>
      </div>
    </header>
	
	  <select id="currency-select" class="currency-dropdown">
  <!-- Southern Africa -->
  <option value="E">E (SZL - Eswatini Lilangeni / ZAR)</option>
  <option value="R">R (ZAR - South African Rand)</option>
  <option value="P">P (BWP - Botswana Pula)</option>
  <option value="MT">MT (MZN - Mozambican Metical)</option>
  <option value="N$">N$ (NAD - Namibian Dollar)</option>
  <option value="ZK">ZK (ZMW - Zambian Kwacha)</option>
  <option value="KSh">KSh (KES - Kenyan Shilling)</option>

  <!-- West Africa -->
  <option value="₦">₦ (NGN - Nigerian Naira)</option>
  <option value="GH₵">GH₵ (GHS - Ghanaian Cedi)</option>

  <!-- East Africa -->
  <option value="USh">USh (UGX - Ugandan Shilling)</option>
  <option value="TSh">TSh (TZS - Tanzanian Shilling)</option>
  <option value="R₣">R₣ (RWF - Rwandan Franc)</option>

  <!-- North & Central Africa -->
  <option value="E£">E£ (EGP - Egyptian Pound)</option>
  <option value="CFA">CFA (XOF / XAF - Franc)</option>

  <!-- Global Standards -->
  <option value="$">$ (USD - US Dollar)</option>
  <option value="€">€ (EUR - Euro)</option>
  <option value="£">£ (GBP - British Pound)</option>
</select>

    <main class="dashboard">
      <!-- Add Customer Contact Form -->
      <section class="card">
        <div class="card-header">
          <h3>Add New Contact</h3>
        </div>
        <form id="customer-form" class="inline-form">
          <div class="input-group">
            <label for="cust-name">Client Name</label>
            <input type="text" id="cust-name" placeholder="e.g., Sarah Jenkins" required>
          </div>
          <div class="input-group">
            <label for="cust-phone">Phone / WhatsApp (Include Country Code)</label>
            <input type="text" id="cust-phone" placeholder="e.g., +1 555 019 2834 or +268 7612 3456" required>
          </div>
          <div class="input-group">
            <label for="cust-notes">Notes / Preferences</label>
            <input type="text" id="cust-notes" placeholder="e.g., Satin Bonnets, Size M">
          </div>
          <button type="submit" class="btn-action" style="background: var(--accent);">Save Contact</button>
        </form>
      </section>

      <!-- Order & Deposit Tracker Form -->
      <section class="card">
        <div class="card-header">
          <h3>Record Order / Pre-Order / Return</h3>
        </div>
        <form id="order-tracker-form" class="inline-form">
          <div class="input-group">
            <label for="order-cust-select">Select Customer</label>
            <select id="order-cust-select" class="currency-dropdown" style="width: 100%;" required>
              <option value="">Loading contacts...</option>
            </select>
          </div>
          <div class="input-group">
            <label for="order-desc">Item / Description</label>
            <input type="text" id="order-desc" placeholder="e.g., 2x Custom Satin Bonnets" required>
          </div>
          <div class="input-group">
            <label for="order-total">Total Price (<span class="currency-symbol">E</span>)</label>
            <input type="number" id="order-total" step="0.01" placeholder="0.00" required>
          </div>
          <div class="input-group">
            <label for="order-deposit">Amount Paid (<span class="currency-symbol">E</span>)</label>
            <input type="number" id="order-deposit" step="0.01" placeholder="0.00" required>
          </div>
          <div class="input-group">
            <label for="order-status">Order Status</label>
            <select id="order-status" class="currency-dropdown" style="width: 100%;">
              <option value="Deposit Paid">Deposit / Partial</option>
              <option value="In Production">In Production</option>
              <option value="Pending Delivery">Pending Delivery</option>
              <option value="Ready for Pickup">Ready for Pickup</option>
              <option value="Fully Paid">Fully Paid</option>
              <option value="Returned/Refunded">Returned/Refunded</option>
            </select>
          </div>
          <button type="submit" class="btn-action" style="background: var(--success);">Record Order</button>
        </form>
      </section>

      <!-- Detailed Customer Account View -->
      <section class="card" id="history-card" style="display: none;">
        <div class="card-header">
          <h3 id="history-customer-name">Customer Account Details</h3>
          <button class="btn-small-danger" onclick="closeHistory()">Close</button>
        </div>
        <div id="customer-history-list" class="receipt-box" style="color: var(--text-main); font-family: inherit;">
          <p class="muted">Select a customer to view history.</p>
        </div>
      </section>

  <!-- Customer Directory & Balances Table -->
<section class="card">
  <div class="card-header">
    <h3>Saved Contacts & Balances</h3>
  </div>
  <div class="inventory-list-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Contact</th>
          <th>Notes</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="customer-table-body">
        <tr>
          <td colspan="4" class="muted">Loading contacts...</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
  
    </main>
  </div>
 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="customers.js"></script>
  <script src="app.js"></script>
</body>
</html>
